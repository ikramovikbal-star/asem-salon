<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>ACEM - Салон Красоты</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --gold: #C5A059;
            --black: #1A1A1A;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background:
                linear-gradient(
                    rgba(255, 255, 255, 0.4),
                    rgba(255, 255, 255, 0.7)
                ),
                url('https://images.unsplash.com/photo-1527799820374-dcf8d9d4a388?q=80&w=1920')
                center / cover fixed;
            color: var(--black);
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        h1,
        h2,
        h3,
        .serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            z-index: 3000;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        #splash-screen img {
            width: 80%;
            max-width: 450px;
            mix-blend-mode: multiply;
            animation:
                premiumReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
                floatPremium 4s ease-in-out infinite 1.5s;
        }

        .tap-text {
            margin-top: 40px;
            font-size: 13px;
            color: #777;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            font-weight: 400;
        }

        @keyframes premiumReveal {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(30px);
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        @keyframes floatPremium {
            0%,
            100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        @keyframes smoothShow {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 50px;
        }

        .active-screen {
            display: block;
            animation: smoothShow 0.5s ease;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .header img {
            height: 180px;
            max-width: min(80vw, 450px);
            cursor: pointer;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            font-size: 24px;
            color: var(--black);
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .admin-icon-btn {
            position: fixed;
            right: 20px;
            top: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .admin-icon-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 1);
        }

        .menu-title-container {
            text-align: center;
            margin: 10px 0 25px 0;
        }

        .menu-title {
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--black);
            margin: 0;
        }

        .menu-title-line {
            width: 60px;
            height: 2px;
            background-color: var(--gold);
            margin: 15px auto 0;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 35px;
        }

        .link-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 16px 20px;
            text-decoration: none;
            color: var(--black);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }

        .link-row:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 1);
        }

        .link-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            margin-right: 15px;
        }

        .link-text {
            flex-grow: 1;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .link-arrow {
            color: var(--gold);
            font-size: 16px;
            font-weight: bold;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .service-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            aspect-ratio: 1 / 1;
            background-color: #111;
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(197, 160, 89, 0.2);
        }

        .service-card:active {
            transform: scale(0.98);
        }

        .service-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .service-card:hover img {
            transform: scale(1.03);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.9) 0%,
                    rgba(0, 0, 0, 0.4) 60%,
                    transparent 100%
                );
            padding: 50px 20px 25px;
            text-align: center;
        }

        .card-overlay h3 {
            font-size: 30px;
            margin: 0 0 8px 0;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .book-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 3px;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .service-card:hover .book-text {
            transform: translateX(5px);
            color: var(--gold);
        }

        .booking-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
        }

        .service-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
            color: var(--black);
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 35px;
            border-left: 5px solid var(--gold);
        }

        .summary-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 8px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            border: none;
            padding-bottom: 0;
        }

        .summary-label {
            color: #777;
            font-weight: 500;
        }

        .summary-val {
            color: var(--black);
            font-weight: 600;
            text-align: right;
        }

        .highlight-val {
            color: var(--gold);
            font-size: 18px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            display: block;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.8);
            color: var(--black);
            outline: none;
            transition: 0.3s;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        input:focus {
            border-color: var(--gold);
            background: #fff;
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.15);
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .slot {
            padding: 16px 0;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            border: 1px solid #ddd;
            background: var(--white);
            color: var(--black);
            transition: 0.2s;
        }

        .slot.green:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .slot.red {
            background: rgba(0, 0, 0, 0.03);
            color: #aaa;
            text-decoration: line-through;
            pointer-events: none;
            border: none;
        }

        .slot.selected {
            background: var(--black);
            color: var(--gold);
            border-color: var(--black);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, var(--gold), #a88444);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.4);
            transition: 0.3s;
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .booking-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid var(--gold);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .btn-delete {
            background: transparent;
            color: #d9534f;
            border: 1px solid rgba(217, 83, 79, 0.3);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            margin-left: 10px;
        }

        .btn-delete:active {
            background: #d9534f;
            color: #fff;
        }

        .admin-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .logout-btn {
            border: 1px solid #ddd;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
        }

        .status-text {
            text-align: center;
            color: #777;
        }

        .status-text.error {
            color: #b00020;
        }

        @media (max-width: 600px) {
            .screen {
                padding: 12px;
                padding-bottom: 35px;
            }

            .header img {
                height: 130px;
            }

            .booking-container {
                padding: 25px 18px;
            }

            .menu-title {
                font-size: 27px;
                letter-spacing: 3px;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .summary-row {
                font-size: 14px;
            }
        }
    </style>
</head>

    <script>
        const MOM_WHATSAPP = "77471059193";

        let currentService = "";
        let selectedTime = null;

        function formatDate(dateStr) {
            if (!dateStr) return "---";

            const [year, month, day] = dateStr.split("-").map(Number);
            const localDate = new Date(year, month - 1, day);

            return localDate.toLocaleDateString("ru-RU", {
                day: "numeric",
                month: "long"
            });
        }

        function getLocalToday() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const today = getLocalToday();
            const dateInput = document.getElementById("c_date");

            dateInput.value = today;
            dateInput.min = today;
        });

        function enterApp() {
            document.getElementById("splash-screen").style.opacity = "0";

            setTimeout(() => {
                document.getElementById("splash-screen").style.display = "none";
                document
                    .getElementById("menu-screen")
                    .classList.add("active-screen");

                document.getElementById("adminBtn").style.display = "flex";
            }, 500);
        }

        async function openBooking(serviceName) {
            currentService = serviceName;
            selectedTime = null;

            document.getElementById("selected-service-title").innerText =
                serviceName;

            document.getElementById("sum-service").innerText =
                serviceName;

            document
                .getElementById("menu-screen")
                .classList.remove("active-screen");

            document
                .getElementById("booking-screen")
                .classList.add("active-screen");

            document.getElementById("adminBtn").style.display = "none";

            window.scrollTo(0, 0);

            await generateTimeSlots();
        }

        function goBackToMenu() {
            document
                .getElementById("booking-screen")
                .classList.remove("active-screen");

            document
                .getElementById("menu-screen")
                .classList.add("active-screen");

            document.getElementById("adminBtn").style.display = "flex";

            selectedTime = null;
        }

        async function generateTimeSlots() {
            const dateInput = document.getElementById("c_date").value;
            const container = document.getElementById("time-container");

            if (!dateInput || !currentService) {
                container.innerHTML = "";
                return;
            }

            container.innerHTML =
                '<p class="status-text">Загрузка времени...</p>';

            selectedTime = null;

            document.getElementById("sum-date").innerText =
                formatDate(dateInput);

            document.getElementById("sum-time").innerText =
                "Не выбрано";

            document.getElementById("sum-time").style.color =
                "var(--black)";

            const schedule = [
                "10:00",
                "11:00",
                "12:00",
                "13:00",
                "14:00",
                "15:00",
                "16:00",
                "17:00",
                "18:00"
            ];

            try {
                const params = new URLSearchParams({
                    date: dateInput,
                    service: currentService
                });

                const response = await fetch(
                    `/api/booked-times?${params.toString()}`,
                    {
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Ошибка загрузки времени"
                    );
                }

                const bookedTimes = data.times || [];

                container.innerHTML = "";

                schedule.forEach(time => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.innerText = time;

                    if (bookedTimes.includes(time)) {
                        btn.className = "slot red";
                    } else {
                        btn.className = "slot green";

                        btn.onclick = () => {
                            document
                                .querySelectorAll(".slot")
                                .forEach(el => {
                                    el.classList.remove("selected");
                                });

                            btn.classList.add("selected");
                            selectedTime = time;

                            document.getElementById("sum-time").innerText =
                                time;

                            document.getElementById("sum-time").style.color =
                                "var(--gold)";
                        };
                    }

                    container.appendChild(btn);
                });
            } catch (error) {
                container.innerHTML =
                    `<p class="status-text error">${escapeHtml(error.message)}</p>`;
            }
        }

        async function submitBooking() {
            const name = document.getElementById("c_name").value.trim();
            const phone = document.getElementById("c_phone").value.trim();
            const date = document.getElementById("c_date").value;

            if (
                !name ||
                phone.replace(/\D/g, "").length < 11 ||
                !selectedTime
            ) {
                alert(
                    "Пожалуйста, заполните все данные и выберите время."
                );
                return;
            }

            const submitBtn =
                document.getElementById("submitBookingBtn");

            const oldText = submitBtn.innerText;

            submitBtn.disabled = true;
            submitBtn.innerText = "Сохраняем...";

            try {
                const response = await fetch("/api/bookings", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        phone,
                        service: currentService,
                        date,
                        time: selectedTime
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Не удалось создать запись"
                    );
                }

                const text =
`Здравствуйте! Хочу записаться в салон ACEM

Услуга: ${currentService}
Дата: ${formatDate(date)}
Время: ${selectedTime}
Имя: ${name}
Телефон: ${phone}`;

                const whatsappUrl =
                    `https://wa.me/${MOM_WHATSAPP}` +
                    `?text=${encodeURIComponent(text)}`;

                document.getElementById("c_name").value = "";
                document.getElementById("c_phone").value = "+7";

                alert("Запись сохранена!");

                window.open(
                    whatsappUrl,
                    "_blank",
                    "noopener,noreferrer"
                );

                goBackToMenu();
            } catch (error) {
                alert(error.message);

                if (
                    error.message.includes("занято")
                ) {
                    await generateTimeSlots();
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = oldText;
            }
        }

        async function openAdmin() {
            const pass = prompt("Введите код доступа:");

            if (pass === null) {
                return;
            }

            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        password: pass
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Неверный код"
                    );
                }

                document
                    .getElementById("menu-screen")
                    .classList.remove("active-screen");

                document
                    .getElementById("booking-screen")
                    .classList.remove("active-screen");

                document
                    .getElementById("admin-screen")
                    .classList.add("active-screen");

                document.getElementById("adminBtn").style.display =
                    "none";

                window.scrollTo(0, 0);

                await renderAdminBookings();
            } catch (error) {
                alert(error.message);
            }
        }

        async function renderAdminBookings() {
            const container =
                document.getElementById("admin-bookings-list");

            container.innerHTML =
                '<p class="status-text">Загрузка...</p>';

            try {
                const response = await fetch(
                    "/api/admin/bookings",
                    {
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Нет доступа"
                    );
                }

                const bookings = data.bookings || [];

                if (bookings.length === 0) {
                    container.innerHTML =
                        '<p class="status-text">Записей пока нет.</p>';
                    return;
                }

                container.innerHTML = bookings
                    .map(b => `
                        <div class="booking-card">
                            <div class="card-header">
                                <strong
                                    class="serif"
                                    style="color:var(--black); font-size:20px;"
                                >
                                    ${escapeHtml(b.service)}
                                    |
                                    ${escapeHtml(b.time)}
                                </strong>

                                <button
                                    class="btn-delete"
                                    onclick="deleteBooking(${Number(b.id)})"
                                >
                                    Удалить
                                </button>
                            </div>

                            <p style="margin-top:10px;">
                                <strong>Дата:</strong>
                                ${formatDate(b.date)}
                            </p>

                            <p>
                                <strong>Клиент:</strong>
                                ${escapeHtml(b.name)}
                            </p>

                            <p>
                                <strong>Тел:</strong>
                                <a
                                    href="tel:${escapeAttribute(b.phone)}"
                                    style="
                                        color:var(--gold);
                                        font-weight:bold;
                                        text-decoration:none;
                                    "
                                >
                                    ${escapeHtml(b.phone)}
                                </a>
                            </p>
                        </div>
                    `)
                    .join("");
            } catch (error) {
                container.innerHTML =
                    `<p class="status-text error">${escapeHtml(error.message)}</p>`;
            }
        }

        async function deleteBooking(id) {
            const ok = confirm(
                "Отменить эту запись? Время снова станет свободным."
            );

            if (!ok) {
                return;
            }

            try {
                const response = await fetch(
                    `/api/admin/bookings/${id}`,
                    {
                        method: "DELETE",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Не удалось удалить запись"
                    );
                }

                await renderAdminBookings();
            } catch (error) {
                alert(error.message);
            }
        }

        async function logoutAdmin() {
            try {
                await fetch("/api/admin/logout", {
                    method: "POST"
                });
            } finally {
                closeAdmin();
            }
        }

        function closeAdmin() {
            document
                .getElementById("admin-screen")
                .classList.remove("active-screen");

            document
                .getElementById("menu-screen")
                .classList.add("active-screen");

            document.getElementById("adminBtn").style.display = "flex";
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll('"', "&quot;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        }
    </script>
</body>
</html>
